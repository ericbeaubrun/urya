name: Supabase keep-alive

# Le plan gratuit Supabase met le projet en pause après ~7 jours sans activité.
# Un appel REST tous les 3 jours suffit à réinitialiser ce compteur.
on:
  schedule:
    # 06:17 UTC, les 1/4/7/10/... du mois (~tous les 3 jours).
    # Minute décalée volontairement : les crons à pile sont mis en file par
    # GitHub et peuvent être retardés de plusieurs dizaines de minutes.
    - cron: '17 6 */3 * *'
  # Permet de déclencher manuellement depuis l'onglet Actions.
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          status=$(curl --silent --show-error --fail-with-body \
            --max-time 30 \
            --write-out '%{http_code}' --output /tmp/body.txt \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/site_content?select=id&limit=1")

          echo "HTTP $status"
          cat /tmp/body.txt
